name: Build and Push Image

# 触发：
#  - 推送到 master 分支：自动构建并推送镜像（latest + 分支名 + sha）
#  - 推送 v* 标签（如 v0.5.0）：自动构建并推送 semver 版本标签
#  - 也可在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # tag 规则：
          #  - tag 推送：生成 semver 标签（x.y.z / x.y / x）
          #  - 分支推送（master）：生成分支名标签（master）
          #  - 所有触发方式都生成 latest 与 sha（定位具体提交）
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=latest
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # fallback：如果 metadata-action 未产出任何 tag（极端情况），使用 latest 兜底
          tags: ${{ steps.meta.outputs.tags != '' && steps.meta.outputs.tags || format('ghcr.io/{0}:latest', github.repository) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha
          # 只对前端构建阶段（fe）禁用层缓存：每次 CI 都强制实跑 npm run build，
          # 杜绝 gha 复用旧的 dist 层导致「version.json 新、dist 旧」的不一致。
          no-cache-filters: fe
          # 注入版本号：构建提交 SHA 与构建时间，供镜像内 /app/version.json 使用
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
          provenance: false
