services:
  aether-nav:
    # 方式一（推荐，国内加速）：拉取 GitHub Actions 构建好的镜像，走南京大学 ghcr 代理
    # 注意：代理前缀是 ghcr.nju.edu.cn，与 ghcr.io 对应；latest 对应最新发版
    image: ghcr.nju.edu.cn/anooki-c/aether-nav:latest
    # 方式二（本机构建）：把上面 image 两行注释掉，取消下面这行注释即可
    # build: .
    container_name: aether-nav
    ports:
      - "5000:5000"
    environment:
      # 默认管理员账号（首次启动 seed 创建）；如需自定义改这里即可
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - SECRET_KEY=change-me-in-prod
      - TOKEN_SECRET=change-me-in-prod
    volumes:
      # 绑定到宿主机 ./data，方便用 Navicat 等工具直接打开 ./data/instance/app.db 维护数据
      - ./data/instance:/app/backend/instance
      - ./data/uploads:/app/backend/uploads
    restart: unless-stopped
